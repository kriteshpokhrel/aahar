name: CI

on:
  push:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: aahar_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d aahar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Aahar: Host=127.0.0.1;Port=5432;Database=aahar_test;Username=postgres
      AAHAR_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=aahar_test;Username=postgres
      AAHAR_ROUNDS_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=aahar_test;Username=postgres
      AAHAR_RUN_POSTGRES_ROUND_TESTS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies and EF tooling
        run: |
          dotnet restore Aahar-API.slnx
          dotnet tool restore
      - name: Build backend
        run: dotnet build Aahar-API.slnx --configuration Release --no-restore --warnaserror
      - name: Check migration coverage
        run: dotnet ef migrations has-pending-model-changes --project Aahar.Infrastructure --startup-project Aahar.Infrastructure --context RestaurantDbContext --configuration Release --no-build
      - name: Migrate the isolated CI database
        run: dotnet ef database update --project Aahar.Infrastructure --startup-project Aahar.Infrastructure --context RestaurantDbContext --configuration Release --no-build
      - name: Run backend and PostgreSQL tests
        run: dotnet test Aahar.Tests/Aahar.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=backend.trx" --results-directory TestResults
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint -- --deny-warnings
      - name: Build frontend
        run: npm run build
      - name: Test frontend
        run: npm test
